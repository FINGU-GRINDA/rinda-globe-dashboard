user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # The API key lives in the upstream URL, never in the client's request line,
    # so the standard combined format cannot leak it. Keep it that way if you
    # ever add $request_uri-style fields to a proxied location's log.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # ---- Gemini proxy rate limiting -----------------------------------------
    # The proxy spends the server's paid Gemini quota, and it is reachable by
    # anyone on the internet. The model allowlist in the server block removes
    # the "call the most expensive model" vector; this caps volume.
    #
    # Allrinda terminates TLS at a Cloudflare tunnel, so $binary_remote_addr is
    # the tunnel's address and identical for every visitor — keying on it alone
    # would rate-limit all users as one bucket. Prefer the forwarded chain.
    # Caveat: X-Forwarded-For is client-settable, so a determined abuser can
    # rotate it. This is a cost guardrail, not an authentication boundary.
    map $http_x_forwarded_for $gemini_client {
        ""      $binary_remote_addr;
        default $http_x_forwarded_for;
    }
    limit_req_zone $gemini_client zone=gemini_rl:10m rate=20r/m;
    limit_req_status 429;

    # ---- compression -------------------------------------------------------
    # gzip_static serves the .gz files baked in at build time; gzip covers
    # anything generated at runtime (proxied Gemini responses).
    gzip_static on;
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/xml+rss image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
