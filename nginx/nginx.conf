user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # The API key lives in the upstream URL, never in the client's request line,
    # so the standard combined format cannot leak it. Keep it that way if you
    # ever add $request_uri-style fields to a proxied location's log.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # Allrinda terminates TLS at the tunnel, so the client's real scheme/IP
    # arrive in headers. Trust them for redirects and logging.
    map $http_x_forwarded_proto $forwarded_scheme {
        default $scheme;
        https   https;
    }

    # ---- compression -------------------------------------------------------
    # gzip_static serves the .gz files baked in at build time; gzip covers
    # anything generated at runtime (proxied Gemini responses).
    gzip_static on;
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/xml+rss image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
