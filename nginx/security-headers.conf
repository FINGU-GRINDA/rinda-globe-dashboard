# Included from every location that calls add_header — nginx's add_header does
# not merge across levels, so a location that adds even one header drops all of
# the server-level ones. Keeping them in one file makes that re-declaration
# a single include instead of a copy-paste block.
#
# Content-Security-Policy is deliberately NOT set here: index.html already ships
# one in a <meta> tag. Two policies intersect rather than override, so a second
# one here would silently tighten the page into breakage.
add_header X-Content-Type-Options    "nosniff"                       always;
add_header X-Frame-Options           "SAMEORIGIN"                    always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin"                  always;
